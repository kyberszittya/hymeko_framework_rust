<svg viewBox="0 0 800 810" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, sans-serif">
  <title>HyMeKo cognitive architecture with Clifford-FIR as membrane and synaptic transport</title>
  <desc>All components — HOTARU planner, AKOIRE protocol, HIVE substrate, Gömb cascade, Soma-Chordex reflex lane — sit inside a Clifford-FIR membrane. Every inter-component edge passes through a violet synapse: signals travel as graded Cl(p,q) multivectors filtered by learned FIR banks.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="810" fill="#ffffff"/>

  <!-- ===== Clifford-FIR membrane ===== -->
  <rect x="14" y="46" width="772" height="714" rx="22" fill="none" stroke="#7F77DD" stroke-width="5" opacity="0.55"/>
  <rect x="22" y="54" width="756" height="698" rx="18" fill="none" stroke="#7F77DD" stroke-width="1.2" opacity="0.5"/>
  <text x="36" y="76" font-size="13" font-weight="600" fill="#534AB7">Clifford-FIR membrane</text>
  <text x="206" y="76" font-size="10.5" fill="#555555" font-style="italic">synaptic transport — all inter-component signals as Cl(p,q) multivectors, FIR-filtered per synapse</text>

  <!-- ===== Legend ===== -->
  <g font-size="10.5" fill="#555555">
    <rect x="442" y="20" width="24" height="13" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
    <text x="471" y="31">implemented</text>
    <rect x="552" y="20" width="24" height="13" rx="3" fill="none" stroke="#888780" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="581" y="31">spec / planned</text>
    <circle cx="668" cy="26" r="5.5" fill="#AFA9EC" stroke="#534AB7" stroke-width="1.2"/>
    <text x="679" y="31">synapse (Muv)</text>
  </g>

  <!-- ===== HOTARU ===== -->
  <g>
    <rect x="56" y="96" width="300" height="74" rx="8" fill="#ffffff" stroke="#888780" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="72" y="121" font-size="15" font-weight="600" fill="#1a1a1a">HOTARU</text>
    <text x="72" y="139" font-size="11.5" fill="#555555">planner · graph sequencer</text>
    <text x="72" y="155" font-size="11.5" fill="#555555">policy over HIVE-delta space</text>
    <text x="252" y="121" font-size="10" fill="#555555" font-style="italic">L2 deliberation</text>
  </g>

  <!-- ===== AKOIRE ===== -->
  <g>
    <rect x="56" y="232" width="300" height="120" rx="8" fill="#ffffff" stroke="#378ADD" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="72" y="257" font-size="15" font-weight="600" fill="#1a1a1a">AKOIRE</text>
    <text x="176" y="257" font-size="10" fill="#555555" font-style="italic">transaction protocol (spec v0.1)</text>
    <text x="72" y="280" font-size="11" fill="#555555">render → propose (LLM) → parse · lower</text>
    <text x="72" y="297" font-size="11" fill="#555555">→ evaluate ⟂ gate → commit</text>
    <text x="72" y="332" font-size="10.5" fill="#185FA5">sole door for structural mutation</text>
  </g>

  <!-- ===== HIVE ===== -->
  <g>
    <rect x="56" y="420" width="300" height="92" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.8"/>
    <text x="72" y="447" font-size="15" font-weight="600" fill="#1a1a1a">HIVE</text>
    <text x="128" y="447" font-size="10" fill="#555555" font-style="italic">L0 canonical substrate</text>
    <text x="72" y="467" font-size="11.5" fill="#555555">signed typed hypergraph IR + canonical hash</text>
    <text x="72" y="484" font-size="11.5" fill="#555555">compile · project · emit (hymeko_core)</text>
  </g>

  <!-- ===== Gömb ===== -->
  <g>
    <rect x="452" y="150" width="296" height="362" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.8"/>
    <text x="470" y="177" font-size="15" font-weight="600" fill="#1a1a1a">Gömb</text>
    <text x="470" y="194" font-size="10" fill="#555555" font-style="italic">three-shell inference cascade</text>

    <rect x="470" y="208" width="260" height="80" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="1.3"/>
    <text x="486" y="231" font-size="13" font-weight="600" fill="#1a1a1a">Clifford-FIR</text>
    <text x="600" y="231" font-size="9.5" fill="#534AB7" font-style="italic">membrane, shell role</text>
    <text x="486" y="249" font-size="11" fill="#555555">outer shell · edge decoration</text>
    <text x="486" y="265" font-size="11" fill="#555555">grade assignment + FIR ring conv</text>

    <rect x="470" y="310" width="260" height="80" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="1.3"/>
    <text x="486" y="333" font-size="13" font-weight="600" fill="#1a1a1a">HSiKAN</text>
    <text x="486" y="351" font-size="11" fill="#555555">middle shell · balance scoring</text>
    <text x="486" y="367" font-size="11" fill="#555555">mixed-arity cycle pool · CR splines</text>

    <rect x="470" y="412" width="260" height="76" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="1.3"/>
    <text x="486" y="435" font-size="13" font-weight="600" fill="#1a1a1a">CPML</text>
    <text x="486" y="453" font-size="11" fill="#555555">inner core · grade-0 readout ⟨·⟩₀</text>
    <text x="486" y="469" font-size="11" fill="#555555">grade-preserving poly layers</text>

    <path d="M600 288 L600 306" stroke="#534AB7" stroke-width="1.4" marker-end="url(#arr)"/>
    <path d="M600 390 L600 408" stroke="#534AB7" stroke-width="1.4" marker-end="url(#arr)"/>
  </g>

  <!-- ===== Deliberative edges with synapses ===== -->
  <g font-size="10.5" fill="#555555" stroke-width="1.4">
    <path d="M186 170 L186 228" stroke="#555555" fill="none" marker-end="url(#arr)"/>
    <circle cx="186" cy="199" r="6" fill="#AFA9EC" stroke="#534AB7" stroke-width="1.3"/>
    <text x="198" y="195">delta sequences</text>
    <path d="M136 228 L136 170" stroke="#555555" fill="none" marker-end="url(#arr)"/>
    <circle cx="136" cy="199" r="6" fill="#AFA9EC" stroke="#534AB7" stroke-width="1.3"/>
    <text x="198" y="210">commit / reject</text>

    <path d="M186 352 L186 416" stroke="#555555" fill="none" marker-end="url(#arr)"/>
    <circle cx="186" cy="384" r="6" fill="#AFA9EC" stroke="#534AB7" stroke-width="1.3"/>
    <text x="198" y="380">commit delta</text>
    <path d="M136 416 L136 352" stroke="#555555" fill="none" marker-end="url(#arr)"/>
    <circle cx="136" cy="384" r="6" fill="#AFA9EC" stroke="#534AB7" stroke-width="1.3"/>
    <text x="198" y="396">render ambience</text>

    <path d="M356 466 L448 466" stroke="#555555" fill="none" marker-end="url(#arr)"/>
    <circle cx="402" cy="466" r="6" fill="#AFA9EC" stroke="#534AB7" stroke-width="1.3"/>
    <text x="368" y="454">project π(H)</text>

    <path d="M452 292 C 410 292, 400 292, 360 292" stroke="#555555" fill="none" marker-end="url(#arr)"/>
    <circle cx="406" cy="292" r="6" fill="#AFA9EC" stroke="#534AB7" stroke-width="1.3"/>
    <text x="368" y="280">verdict ⟂</text>

    <path d="M452 190 C 410 165, 400 145, 360 133" stroke="#555555" fill="none" marker-end="url(#arr)"/>
    <circle cx="406" cy="164" r="6" fill="#AFA9EC" stroke="#534AB7" stroke-width="1.3"/>
    <text x="372" y="152">state utility</text>

    <path d="M56 466 C 34 466, 34 133, 52 133" stroke="#555555" stroke-dasharray="3 3" fill="none" marker-end="url(#arr)"/>
    <text x="40" y="300" transform="rotate(-90 40 300)" text-anchor="middle" font-size="9.5">canonical hash → memoized states</text>
  </g>

  <!-- ===== Soma-Chordex ===== -->
  <g>
    <rect x="136" y="586" width="528" height="92" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="154" y="613" font-size="15" font-weight="600" fill="#1a1a1a">Soma-Chordex</text>
    <text x="284" y="613" font-size="10" fill="#555555" font-style="italic">L1 reflex lane · ≤10 ms · bypasses AKOIRE gate</text>
    <text x="154" y="635" font-size="11.5" fill="#555555">fast sensorimotor transport · single motor authority</text>
    <text x="154" y="652" font-size="11.5" fill="#555555">Soma vision backbone: quadtree · Hodge · stim graphs (implemented)</text>
  </g>

  <g font-size="10.5" fill="#555555" stroke-width="1.6">
    <path d="M-2 632 L132 632" stroke="#0F6E56" fill="none" marker-end="url(#arr)"/>
    <circle cx="22" cy="632" r="6" fill="#AFA9EC" stroke="#534AB7" stroke-width="1.3"/>
    <text x="38" y="620" fill="#0F6E56" font-weight="600">exteroception</text>
    <path d="M664 632 L800 632" stroke="#0F6E56" fill="none" marker-end="url(#arr)"/>
    <circle cx="778" cy="632" r="6" fill="#AFA9EC" stroke="#534AB7" stroke-width="1.3"/>
    <text x="676" y="620" fill="#0F6E56" font-weight="600">actuators</text>

    <path d="M226 586 L226 516" stroke="#555555" fill="none" marker-end="url(#arr)"/>
    <circle cx="226" cy="551" r="6" fill="#AFA9EC" stroke="#534AB7" stroke-width="1.3"/>
    <text x="238" y="548">percept deltas (append-only)</text>

    <path d="M600 512 L600 582" stroke="#555555" stroke-dasharray="3 3" fill="none" marker-end="url(#arr)"/>
    <circle cx="600" cy="547" r="6" fill="#AFA9EC" stroke="#534AB7" stroke-width="1.3"/>
    <text x="612" y="544">descending modulation</text>
  </g>

  <!-- ===== NAGARE execution substrate ===== -->
  <g>
    <rect x="36" y="698" width="728" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.6"/>
    <text x="54" y="718" font-size="14" font-weight="600" fill="#1a1a1a">NAGARE 流れ</text>
    <text x="178" y="718" font-size="10" fill="#555555" font-style="italic">dataflow execution substrate (hymeko_nagare, skeleton)</text>
    <text x="54" y="736" font-size="10.5" fill="#555555">SoA cycle pools · closed-form Clifford (fwd, bwd) op pairs · no autograd · Rayon / wgpu · Nagare→HSMM compiler (frozen) → Zynq FPGA</text>
    <!-- runs-on indicators -->
    <path d="M756 512 C 772 560, 772 650, 758 700" stroke="#5F5E5A" stroke-dasharray="3 3" fill="none" marker-end="url(#arr)"/>
    <text x="770" y="610" font-size="9.5" fill="#555555" transform="rotate(90 770 610)" text-anchor="middle">Gömb shells lower to ops</text>
    <path d="M400 678 L400 694" stroke="#5F5E5A" stroke-dasharray="3 3" fill="none" marker-end="url(#arr)"/>
    <text x="408" y="690" font-size="9.5" fill="#555555">reflex kernels run here</text>
  </g>
</svg>
