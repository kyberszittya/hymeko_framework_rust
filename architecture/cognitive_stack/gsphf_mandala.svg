      <text x="718" y="237" text-anchor="middle" font-size="10" fill="#555555">alias invariance · content addressing</text>
      <text x="718" y="252" text-anchor="middle" font-size="9.5" fill="#5F5E5A">strategy doc → HOTARU memoization</text></g>
    <g><rect x="722" y="455" width="196" height="62" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.8"/>
