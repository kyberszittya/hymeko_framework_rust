      <text x="820" y="509" text-anchor="middle" font-size="9.5" fill="#185FA5">SMC-WIP + CogInfoCom · submitted</text></g>
    <g><rect x="620" y="712" width="196" height="62" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.8"/>
      <text x="718" y="734" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">Strict protocol + audit</text>
      <text x="718" y="751" text-anchor="middle" font-size="10" fill="#555555">label-shuffle falsifiability gate</text>
      <text x="718" y="766" text-anchor="middle" font-size="9.5" fill="#993C1D">P2 Nature draft · P1 TPAMI plan</text></g>
    <g><rect x="372" y="806" width="196" height="62" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.8"/>
      <text x="470" y="828" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">Spectral-entropy regularizer</text>
      <text x="470" y="845" text-anchor="middle" font-size="10" fill="#555555">H_norm + Lyapunov λ-schedule</text>
      <text x="470" y="860" text-anchor="middle" font-size="9.5" fill="#185FA5">T-SMC Cybernetics · submitted</text></g>
    <g><rect x="124" y="712" width="196" height="62" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.8"/>
      <text x="222" y="734" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">hymeko_clifford · membrane</text>
      <text x="222" y="751" text-anchor="middle" font-size="10" fill="#555555">multivector autograd · synaptic ABI</text>
      <text x="222" y="766" text-anchor="middle" font-size="9.5" fill="#0F6E56">crate on disk · membrane planned</text></g>
    <g><rect x="22" y="455" width="196" height="62" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.6" stroke-dasharray="6 4"/>
      <text x="120" y="477" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">NAGARE 流れ</text>
      <text x="120" y="494" text-anchor="middle" font-size="10" fill="#555555">no-autograd dataflow ML · Rayon/wgpu</text>
      <text x="120" y="509" text-anchor="middle" font-size="9.5" fill="#5F5E5A">skeleton · MLSys '27 target</text></g>
    <g><rect x="124" y="198" width="196" height="62" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.6" stroke-dasharray="6 4"/>
      <text x="222" y="220" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">HSMM</text>
      <text x="222" y="237" text-anchor="middle" font-size="10" fill="#555555">storage-modification machine on 𝒢</text>
      <text x="222" y="252" text-anchor="middle" font-size="9.5" fill="#5F5E5A">Zenodo in review → Zynq FPGA '28</text></g>
  </g>

