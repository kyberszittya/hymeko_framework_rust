<svg viewBox="0 0 940 970" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, sans-serif">
  <title>G-SPHF mandala: one object, eight views, nine artifacts</title>
  <desc>Radial map of the HyMeKo research programme. Center: the G-SPHF 5-tuple (V,E,B,sigma,P) with GGK axioms K1-K4. Middle ring: eight mathematical views of the object. Outer ring: the realized artifacts and venues. Enclosing band: the transactional cognitive stack (AKOIRE, HOTARU, Soma-Chordex).</desc>

  <rect x="0" y="0" width="940" height="970" fill="#ffffff"/>

  <!-- ===== Enclosing transactional band ===== -->
  <circle cx="470" cy="486" r="446" fill="none" stroke="#0F6E56" stroke-width="1.4" stroke-dasharray="6 5" opacity="0.7"/>
  <circle cx="470" cy="486" r="460" fill="none" stroke="#0F6E56" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.5"/>
  <defs>
    <path id="bandPath" d="M 470 33 A 453 453 0 1 1 469.9 33"/>
  </defs>
  <text font-size="13" fill="#0F6E56" letter-spacing="1.5">
    <textPath href="#bandPath" startOffset="1%">AKOIRE ⟂ COMMIT GATE · HOTARU POLICY · SOMA-CHORDEX REFLEX LANE — TRANSACTIONAL COGNITION OVER 𝒢</textPath>
  </text>
  <text font-size="13" fill="#0F6E56" letter-spacing="1.5">
    <textPath href="#bandPath" startOffset="52%">HIVE CANONICALIZES STATE · CLIFFORD-FIR MEMBRANE CANONICALIZES SIGNALS · NAGARE EXECUTES · HSMM REALIZES</textPath>
  </text>

  <!-- ===== Spokes (under boxes) ===== -->
  <g stroke="#AFA9EC" stroke-width="1.6">
    <line x1="470" y1="364" x2="470" y2="166"/>
    <line x1="556" y1="400" x2="696" y2="260"/>
    <line x1="592" y1="486" x2="790" y2="486"/>
    <line x1="556" y1="572" x2="696" y2="712"/>
    <line x1="470" y1="608" x2="470" y2="806"/>
    <line x1="384" y1="572" x2="244" y2="712"/>
    <line x1="348" y1="486" x2="150" y2="486"/>
    <line x1="384" y1="400" x2="244" y2="260"/>
  </g>

  <!-- ===== Center: the object ===== -->
  <circle cx="470" cy="486" r="122" fill="#CECBF6" stroke="#534AB7" stroke-width="2.5"/>
  <circle cx="470" cy="486" r="113" fill="none" stroke="#534AB7" stroke-width="0.8" opacity="0.6"/>
  <text x="470" y="448" text-anchor="middle" font-size="24" font-weight="700" fill="#26215C" font-family="Georgia, serif">G-SPHF</text>
  <text x="470" y="478" text-anchor="middle" font-size="16" fill="#26215C" font-family="Georgia, serif" font-style="italic">𝒢 = (V, E, B, σ, P)</text>
  <text x="470" y="503" text-anchor="middle" font-size="12" fill="#3C3489">GGK 4-tuple K = (B, G, μ, r)</text>
  <text x="470" y="522" text-anchor="middle" font-size="12" fill="#3C3489">axioms K1–K4 · CORE-locked</text>
  <text x="470" y="548" text-anchor="middle" font-size="10" fill="#534AB7" font-style="italic">one object — everything below is a view</text>

  <!-- ===== Middle ring: mathematical views ===== -->
  <g>
    <g><rect x="392" y="253" width="156" height="46" rx="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
      <text x="470" y="272" text-anchor="middle" font-size="11" font-weight="600" fill="#26215C">three native views</text>
      <text x="470" y="288" text-anchor="middle" font-size="10" fill="#534AB7">M(𝒢) · star A_S · clique A_K</text></g>
    <g><rect x="540" y="314" width="156" height="46" rx="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
      <text x="618" y="333" text-anchor="middle" font-size="11" font-weight="600" fill="#26215C">canonical quotient</text>
      <text x="618" y="349" text-anchor="middle" font-size="10" fill="#534AB7">WL-patch refinement · h(𝒢)</text></g>
    <g><rect x="602" y="463" width="156" height="46" rx="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
      <text x="680" y="482" text-anchor="middle" font-size="11" font-weight="600" fill="#26215C">cycle sign structure</text>
      <text x="680" y="498" text-anchor="middle" font-size="10" fill="#534AB7">π_C = Π σ — balance algebra</text></g>
    <g><rect x="540" y="595" width="156" height="46" rx="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
      <text x="618" y="614" text-anchor="middle" font-size="11" font-weight="600" fill="#26215C">measurability</text>
      <text x="618" y="630" text-anchor="middle" font-size="10" fill="#534AB7">features w.r.t. 𝒢|E_tr only</text></g>
    <g><rect x="392" y="657" width="156" height="46" rx="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
      <text x="470" y="676" text-anchor="middle" font-size="11" font-weight="600" fill="#26215C">Laplacian spectrum</text>
      <text x="470" y="692" text-anchor="middle" font-size="10" fill="#534AB7">H_norm functional · KA target</text></g>
    <g><rect x="244" y="595" width="156" height="46" rx="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
      <text x="322" y="614" text-anchor="middle" font-size="11" font-weight="600" fill="#26215C">Clifford fields</text>
      <text x="322" y="630" text-anchor="middle" font-size="10" fill="#534AB7">Cl(p,q)-valued, graded</text></g>
    <g><rect x="182" y="463" width="156" height="46" rx="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
      <text x="260" y="482" text-anchor="middle" font-size="11" font-weight="600" fill="#26215C">gradient flows</text>
      <text x="260" y="498" text-anchor="middle" font-size="10" fill="#534AB7">cycle-additive Σ_c · closed-form ∂</text></g>
    <g><rect x="244" y="314" width="156" height="46" rx="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
      <text x="322" y="333" text-anchor="middle" font-size="11" font-weight="600" fill="#26215C">machine memory</text>
      <text x="322" y="349" text-anchor="middle" font-size="10" fill="#534AB7">NAV NEWV NEWE ATT DET MOVC</text></g>
  </g>

